[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "embedplan"
version = "0.1.0"
description = "EmbedPlan: a transition model for LLM planning built on frozen text embeddings. Code for the paper 'Textual Planning with Explicit Latent Transitions'."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Eliezer Shlomi" },
  { name = "Ido Levy" },
  { name = "Eilam Shapira" },
  { name = "Michael Katz" },
  { name = "Guy Uziel" },
  { name = "Segev Shlomov" },
  { name = "Nir Mashkif" },
  { name = "Roi Reichart" },
  { name = "Sarah Keren" },
]
keywords = ["EmbedPlan", "LLM planning", "transition model", "world model", "frozen text embeddings", "classical planning", "PDDL", "ACPBench"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.0",
  "numpy",
  "pandas",
  "pyyaml",
  "tqdm",
  "scipy",
  "scikit-learn",
]

[project.optional-dependencies]
# Build embeddings with the paper's encoders (not needed to re-score cached embeddings).
encoders = ["transformers>=4.40", "sentence-transformers"]
# LoRA fine-tuning of the encoder (experiments/finetune_encoder.py).
lora = ["peft>=0.10", "transformers>=4.40"]
# Direct-LLM baselines through OpenRouter (needs OPENROUTER_API_KEY).
llm = ["requests"]
# Figures and experiment logging.
viz = ["matplotlib", "umap-learn", "wandb"]
dev = ["pytest", "ruff"]
all = ["embedplan[encoders,lora,llm,viz]"]

[project.urls]
Paper = "https://arxiv.org/abs/2602.04557"
Code = "https://github.com/dolev31/EmbedPlan"

[tool.setuptools.packages.find]
include = ["embedplan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["paper", "peo"]

[tool.ruff.lint]
# Correctness only: syntax errors, undefined names, redefinitions and unused imports.
select = ["E9", "F63", "F7", "F82", "F401", "F811"]
